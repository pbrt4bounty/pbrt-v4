name: cpu-windows-build-and-test

on:
  push:
    paths-ignore:
      - '**.md'
      - 'images/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'images/**'

jobs:
  build:
    name: Build and test

    strategy:
      matrix:
        config: [ '', '-DPBRT_DBG_LOGGING=True', '-DPBRT_FLOAT_AS_DOUBLE=True' ]
      fail-fast: false

    runs-on: windows-latest

    steps:
    - name: Checkout pbrt
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Checkout rgb2spectrum tables
      uses: actions/checkout@v4
      with:
        repository: mmp/rgb2spectrum
        path: build
      
    - name: Get cmake
      uses: lukka/get-cmake@latest

    - name: Install pkgconfig and zlib
      run: |
        choco install pkgconfiglite
        vcpkg install zlib:x64-windows
        vcpkg install zlib:x64-windows-static

    - name: Configure
      run: |
        cd build
        cmake .. -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT"/scripts/buildsystems/vcpkg.cmake -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/build/deploy -DPBRT_USE_PREGENERATED_RGB_TO_SPECTRUM_TABLES=True ${{ matrix.config }}
      
    - name: Build
      run: cmake --build build --parallel 3 --config Release --target Install

    - name: Test
      if: ${{ matrix.config == '' }}
      run: .\Release\pbrt_test.exe
      working-directory: build

    - name: Save Windows executable
      if: ${{  matrix.config == '' }}
      uses: actions/upload-artifact@v4
      with:
        name: pbrt-v4
        path: "${{ github.workspace }}/build/deploy/bin/"
        retention-days: 1
    
    
