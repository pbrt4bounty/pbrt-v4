name: gpu-windows-build-only

permissions:           # https://github.com/actions/checkout/issues/254
  actions: write       # Necessary to cancel workflow executions
  checks: write        # Necessary to write reports
  pull-requests: write # Necessary to comment on PRs
  contents: read
  packages: write

on:
  push:
    paths-ignore:
      - '**.md'
      - 'images/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'images/**'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        optix: [ optix-8.0.0 ] # optix-7.5.0, optix-7.7.0, optix-8.0.0 ]
        cuda: [ '12.2.2' ]     # '11.7.0', '12.1.0', '12.2.2', '12.3.2' ]
        os: [ windows-latest ] 

    name: GPU Build Only (${{ matrix.os }}, CUDA ${{ matrix.cuda }}, ${{ matrix.optix }})

    runs-on: ${{ matrix.os }}

    steps:
    - uses: jimver/cuda-toolkit@v0.2.19
      id: cuda-toolkit
      with:
        cuda: ${{ matrix.cuda }}
        method: 'local'
        # sub-packages: '[ "nvcc", "cudart", "visual_studio_integration" ]'

    - name: Check NVCC
      run: nvcc -V

    - name: Checkout pbrt
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Checkout rgb2spectrum tables
      uses: actions/checkout@v4
      with:
        repository: mmp/rgb2spectrum
        path: build

    - name: Cache OptiX headers
      uses: actions/cache@v4
      with:
        path: optix
        key: optix-7.12345

    - name: Get cmake
      uses: lukka/get-cmake@latest

    - name: Install pkgconfig and zlib
      if: ${{ matrix.os == 'windows-latest' }}
      run: |
        choco install pkgconfiglite
        vcpkg install zlib:x64-windows
        vcpkg install zlib:x64-windows-static

    - name: Configure (Windows)
      if: ${{ matrix.os == 'windows-latest' }}
      run: |
        cd build
        cmake .. -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT"/scripts/buildsystems/vcpkg.cmake -DPBRT_USE_PREGENERATED_RGB_TO_SPECTRUM_TABLES=True -DPBRT_OPTIX7_PATH=${{ github.workspace }}/src/ext/optix-dev -DPBRT_GPU_SHADER_MODEL=sm_80

    - name: Build
      # We need to limit the number of jobs so that it doesn't OOM 
      run: cmake --build build --parallel 3 --config Release

    - name: Save Windows executable
      if: ${{ matrix.os == 'windows-latest' }}
      uses: actions/upload-artifact@v4
      with:
        name: pbrt-v4
        path: "${{ github.workspace }}/build/Release/pbrt.exe"


